name: Build NaCl Main Docker Image

on:
  push:
    branches:
      - nacl/main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-nacl-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/network-and-cloud-laboratory-kmitl/npmplus

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set application version
        run: |
          version="$(git rev-parse --short HEAD)"
          jq --arg v "$version" '.version = $v' frontend/package.json > frontend/package.json.tmp
          mv frontend/package.json.tmp frontend/package.json
          jq --arg v "$version" '.version = $v' backend/package.json > backend/package.json.tmp
          mv backend/package.json.tmp backend/package.json
      - name: Build and push x86_64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:nacl-main-x86_64
            ${{ env.IMAGE }}:sha-${{ github.sha }}-x86_64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=nacl-main
          build-args: |
            FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full

  build-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set application version
        run: |
          version="$(git rev-parse --short HEAD)"
          jq --arg v "$version" '.version = $v' frontend/package.json > frontend/package.json.tmp
          mv frontend/package.json.tmp frontend/package.json
          jq --arg v "$version" '.version = $v' backend/package.json > backend/package.json.tmp
          mv backend/package.json.tmp backend/package.json
      - name: Build and push aarch64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:nacl-main-aarch64
            ${{ env.IMAGE }}:sha-${{ github.sha }}-aarch64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=nacl-main
          build-args: |
            FLAGS=-mbranch-protection=standard

  merge:
    runs-on: ubuntu-slim
    needs:
      - build-x86_64
      - build-aarch64
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-architecture manifests
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:nacl-main" \
            "${IMAGE}:nacl-main-x86_64" \
            "${IMAGE}:nacl-main-aarch64"
          docker buildx imagetools create \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${IMAGE}:sha-${GITHUB_SHA}-x86_64" \
            "${IMAGE}:sha-${GITHUB_SHA}-aarch64"
